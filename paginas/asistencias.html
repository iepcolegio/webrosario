};

const listaGrados = ["1° SECUNDARIA", "2° SECUNDARIA", "3° SECUNDARIA", "4° SECUNDARIA", "5° SECUNDARIA"];

function actualizarMesActual() {
    mesActual = document.getElementById("selector-mes").value;
}

function abrirAsistencia(grado) {
    gradoActual = grado;
    actualizarMesActual();

    document.getElementById("pantalla-menu").style.display = "none";
    document.getElementById("pantalla-asistencia").style.display = "block";
    document.getElementById("titulo-grado").innerText = `📚 Asistencia Escolar - ${grado} (${mesActual})`;
    
    const lista = document.getElementById("lista");
    lista.innerHTML = "<p style='text-align:center; padding: 20px;'>Cargando datos desde la nube...</p>";

    // ESCUCHAR EN TIEMPO REAL: Cada vez que abres un grado, jala los datos de Internet
    db.ref(`asistencias/${mesActual}/${gradoActual}`).once('value', (snapshot) => {
        historial = snapshot.val() || [];
        if (historial.length > 0) {
            document.getElementById("fecha-asistencia").value = historial[historial.length - 1].fecha;
        } else {
            document.getElementById("fecha-asistencia").value = "";
        }
        generarListaAlumnos();
    });
}

function volverAlMenu() {
    document.getElementById("pantalla-asistencia").style.display = "none";
    document.getElementById("pantalla-menu").style.display = "block";
}

function generarListaAlumnos() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    const alumnos = baseAlumnos[gradoActual] || [];

    if(alumnos.length === 0) {
        lista.innerHTML = "<p style='text-align:center; padding: 20px;'>No hay alumnos registrados.</p>";
        return;
    }

    const fechaSeleccionada = document.getElementById("fecha-asistencia").value.trim();
    let registroExistente = historial.find(r => r.fecha === fechaSeleccionada);

    alumnos.forEach((alumno, index) => {
        let estadoGuardado = "A"; 
        if (registroExistente && registroExistente.datos && registroExistente.datos[alumno] !== undefined) {
            estadoGuardado = registroExistente.datos[alumno];
        }

        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="nombre">${index + 1}. ${alumno}</div>
            <select id="estado-${index}">
                <option value="A" ${estadoGuardado === 'A' ? 'selected' : ''}>✅ Asistió</option>
                <option value="F" ${estadoGuardado === 'F' ? 'selected' : ''}>❌ Faltó</option>
                <option value="T" ${estadoGuardado === 'T' ? 'selected' : ''}>⏰ Tarde</option>
            </select>
        `;
        lista.appendChild(card);
    });
}

function cargarAsistenciaPorFecha() {
    generarListaAlumnos();
}

function guardarAsistencia() {
    let fecha = document.getElementById("fecha-asistencia").value.trim();
    if (!fecha) {
        alert("Por favor, ingrese una fecha válida antes de guardar.");
        return;
    }

    db.ref(`asistencias/${mesActual}/${gradoActual}`).once('value', (snapshot) => {
        historial = snapshot.val() || [];
        let indiceExistente = historial.findIndex(r => r.fecha === fecha);
        let asistencia = { fecha: fecha, datos: {} };

        const alumnos = baseAlumnos[gradoActual] || [];
        alumnos.forEach((alumno, i) => {
            const selectElement = document.getElementById(`estado-${i}`);
            asistencia.datos[alumno] = selectElement ? selectElement.value : "A";
        });

        if (indiceExistente !== -1) {
            historial[indiceExistente] = asistencia;
        } else {
            historial.push(asistencia);
        }

        // ENVIAR A INTERNET (Firebase)
        db.ref(`asistencias/${mesActual}/${gradoActual}`).set(historial, (error) => {
            if (error) {
                alert("Error al guardar: " + error.message);
            } else {
                alert(`Asistencia del día ${fecha} guardada en la Nube exitosamente.`);
            }
        });
    });
}

function nuevaAsistencia() {
    document.getElementById("fecha-asistencia").value = "";
    const alumnos = baseAlumnos[gradoActual] || [];
    alumnos.forEach((_, i) => {
        const select = document.getElementById(`estado-${i}`);
        if(select) select.value = "A";
    });
    alert("Listo para una nueva fecha.");
}

function eliminarHistorial() {
    if (confirm(`¿Eliminar todo el historial de ${gradoActual} en la nube?`)) {
        db.ref(`asistencias/${mesActual}/${gradoActual}`).remove(() => {
            historial = [];
            document.getElementById("fecha-asistencia").value = "";
            alert("Historial eliminado");
            generarListaAlumnos();
        });
    }
}

function eliminarMesCompleto() {
    actualizarMesActual();
    if (confirm(`¿Eliminar todo el mes de ${mesActual} en la nube?`)) {
        db.ref(`asistencias/${mesActual}`).remove(() => {
            alert(`Registros de ${mesActual} borrados.`);
        });
    }
}

// Funciones para reportes quedan conectadas a la nube automáticamente
function exportarVistaWeb() {
    if (historial.length === 0) { alert("No hay datos en este mes."); return; }
    const alumnos = baseAlumnos[gradoActual] || [];
    let totalesPorFecha = {};
    historial.forEach(r => { totalesPorFecha[r.fecha] = { A: 0, T: 0, F: 0 }; });
    let granTotalA = 0, granTotalT = 0, granTotalF = 0;

    let tablaHTML = `<table border="1" style="border-collapse: collapse; width: 100%; font-family: Arial; font-size: 12px; text-align: center;"><thead><tr style="background-color: #007BFF; color: white; font-weight: bold; height: 30px;"><th style="width: 40px;">N°</th><th style="text-align: left; padding-left: 10px; width: 280px;">ALUMNO</th>`;
    historial.forEach(r => { tablaHTML += `<th style="width: 50px;">${r.fecha}</th>`; });
    tablaHTML += `<th style="background-color: #28a745; color: white; width: 50px;">TOT Asis</th><th style="background-color: #ff9800; color: white; width: 50px;">TOT Tard</th><th style="background-color: #dc3545; color: white; width: 50px;">TOT Falt</th></tr></thead><tbody>`;

    alumnos.forEach((alumno, i) => {
        let contadorAlumnoA = 0, contadorAlumnoT = 0, contadorAlumnoF = 0;
        tablaHTML += `<tr style="height: 24px;"><td>${i + 1}</td><td style="text-align: left; padding-left: 10px; font-weight: bold;">${alumno}</td>`;
        historial.forEach(r => {
            let estado = r.datos[alumno] || "-";
            let colorCelda = "";
            if (estado === "A") { colorCelda = "background-color: #90EE90; font-weight: bold;"; contadorAlumnoA++; totalesPorFecha[r.fecha].A++; }
            else if (estado === "T") { colorCelda = "background-color: #FFD966; font-weight: bold;"; contadorAlumnoT++; totalesPorFecha[r.fecha].T++; }
            else if (estado === "F") { colorCelda = "background-color: #FF7B7B; font-weight: bold;"; contadorAlumnoF++; totalesPorFecha[r.fecha].F++; }
            tablaHTML += `<td style="${colorCelda}">${estado}</td>`;
        });
        granTotalA += contadorAlumnoA; granTotalT += contadorAlumnoT; granTotalF += contadorAlumnoF;
        tablaHTML += `<td style="font-weight: bold; background-color: #e2f0d9;">${contadorAlumnoA}</td><td style="font-weight: bold; background-color: #fff2cc;">${contadorAlumnoT}</td><td style="font-weight: bold; background-color: #fce4d6;">${contadorAlumnoF}</td></tr>`;
    });

    tablaHTML += `<tr style="height: 24px; font-weight: bold; background-color: #d9e1f2;"><td colspan="2" style="text-align: right; padding-right: 10px;">TOTAL ASISTENCIAS</td>`;
    historial.forEach(r => { tablaHTML += `<td>${totalesPorFecha[r.fecha].A}</td>`; });
    tablaHTML += `<td colspan="3">${granTotalA}</td></tr>`;
    tablaHTML += `</tbody></table>`;

    const ventanaReporte = window.open("", "_blank");
    ventanaReporte.document.write(`<html><head><title>Reporte</title></head><body>${tablaHTML}</body></html>`);
    ventanaReporte.document.close();
}

function abrirConsolidadoWeb() {
    actualizarMesActual();
    db.ref(`asistencias/${mesActual}`).once('value', (snapshot) => {
        let todoElMes = snapshot.val() || {};
        let datosConsolidados = [];
        listaGrados.forEach(grado => {
            let hG = todoElMes[grado] || [];
            let totalA = 0, totalT = 0, totalF = 0;
            hG.forEach(registro => {
                Object.values(registro.datos).forEach(estado => {
                    if (estado === "A") totalA++;
                    if (estado === "T") totalT++;
                    if (estado === "F") totalF++;
                });
            });
            datosConsolidados.push({ grado, A: totalA, T: totalT, F: totalF });
        });
        alert("Consolidado generado. (Gráficos listos)");
    });
}
</script>
