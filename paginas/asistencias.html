<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<title>Portal Escolar - Asistencia</title>

<style>
    /* --- ESTILOS GENERALES Y MENÚ PRINCIPAL --- */
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to right, #1e3c72, #2a5298);
        text-align: center;
        color: white;
        margin: 0;
        padding: 0;
        min-height: 100vh;
    }

    .contenedor-menu {
        margin-top: 30px;
        display: block;
    }

    h1 {
        margin-top: 10px;
        font-size: 32px;
    }

    .caja-mes {
        background: rgba(255, 255, 255, 0.15);
        padding: 15px;
        border-radius: 12px;
        width: 280px;
        margin: 20px auto 0 auto;
        border: 1px solid rgba(255, 255, 255, 0.3);
    }

    .caja-mes label {
        display: block;
        font-weight: bold;
        margin-bottom: 8px;
        font-size: 16px;
        color: #ffcc00;
    }

    .select-mes-principal {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 16px;
        font-weight: bold;
        color: #1e3c72;
        background: white;
        cursor: pointer;
    }

    .botones-menu {
        margin-top: 25px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .boton-grado {
        width: 250px;
        padding: 15px;
        font-size: 18px;
        border-radius: 10px;
        background: #ffcc00;
        color: black;
        text-decoration: none;
        font-weight: bold;
        transition: 0.3s;
        border: none;
        cursor: pointer;
    }

    .boton-grado:hover {
        background: #ffaa00;
        transform: scale(1.05);
    }

    .boton-consolidado {
        background: #00ecb8;
        color: #03233c;
        margin-top: 5px;
        border: 2px solid white;
    }
    .boton-consolidado:hover {
        background: #00c499;
    }

    /* Estilo especial para el botón de eliminación masiva en el menú principal */
    .boton-eliminar-mes {
        background: #dc3545;
        color: white;
        margin-top: 5px;
        border: 2px solid white;
        font-size: 15px;
        width: 250px;
    }
    .boton-eliminar-mes:hover {
        background: #bd2130;
    }

    /* --- ESTILOS DE LA SECCIÓN DE ASISTENCIA --- */
    .seccion-asistencia {
        display: none;
        background: #f2f2f2;
        color: black;
        padding: 20px;
        min-height: 100vh;
        box-sizing: border-box;
        text-align: left;
    }

    .seccion-asistencia h2 {
        text-align: center;
        margin-top: 10px;
    }

    .card {
        background: white;
        padding: 15px;
        border-radius: 10px;
        margin-bottom: 10px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .nombre {
        font-size: 18px;
        margin-bottom: 10px;
        font-weight: bold;
        word-break: break-word;
    }

    select {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        font-size: 16px;
    }

    .botones-asistencia {
        display: flex;
        flex-direction: column;
        gap: 10px;
        margin-top: 20px;
    }

    .btn-action {
        padding: 15px;
        border: none;
        border-radius: 10px;
        color: white;
        font-size: 17px;
        cursor: pointer;
        transition: 0.3s;
        font-weight: bold;
        text-align: center;
    }

    .btn-action:hover {
        opacity: 0.9;
        transform: scale(1.02);
    }

    .volver { background: #6c757d; margin-bottom: 15px; }
    .guardar { background: #28a745; }
    .nueva { background: #ff9800; }
    .exportar { background: #007bff; }
    .eliminar { background: #dc3545; }
</style>

const listaGrados = ["1° SECUNDARIA", "2° SECUNDARIA", "3° SECUNDARIA", "4° SECUNDARIA", "5° SECUNDARIA"];

function actualizarMesActual() {
    mesActual = document.getElementById("selector-mes").value;
}

function abrirAsistencia(grado) {
    gradoActual = grado;
    actualizarMesActual();

    document.getElementById("pantalla-menu").style.display = "none";
    document.getElementById("pantalla-asistencia").style.display = "block";
    
    document.getElementById("titulo-grado").innerText = `📚 Asistencia Escolar - ${grado} (${mesActual})`;
    
    historial = JSON.parse(localStorage.getItem(`historial_${gradoActual}_${mesActual}`)) || [];
    generarListaAlumnos();
}

function volverAlMenu() {
    document.getElementById("pantalla-asistencia").style.display = "none";
    document.getElementById("pantalla-menu").style.display = "block";
}

function generarListaAlumnos() {
    const lista = document.getElementById("lista");
    lista.innerHTML = "";
    const alumnos = baseAlumnos[gradoActual] || [];

    if(alumnos.length === 0) {
        lista.innerHTML = "<p style='text-align:center; padding: 20px;'>No hay alumnos registrados en este grado.</p>";
        return;
    }

    alumnos.forEach((alumno, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
            <div class="nombre">${index + 1}. ${alumno}</div>
            <select id="estado-${index}">
                <option value="A">✅ Asistió</option>
                <option value="F">❌ Faltó</option>
                <option value="T">⏰ Tarde</option>
            </select>
        `;
        lista.appendChild(card);
    });
}

function guardarAsistencia() {
    let fecha = prompt(`Ingrese fecha para el mes de ${mesActual} (ej: 11/05)`);
    if (!fecha) return;

    if (historial.some(r => r.fecha === fecha)) {
        alert("Esa fecha ya existe en este mes.");
        return;
    }

    let asistencia = {
        fecha,
        datos: {}
    };

    const alumnos = baseAlumnos[gradoActual] || [];
    alumnos.forEach((alumno, i) => {
        asistencia.datos[alumno] = document.getElementById(`estado-${i}`).value;
    });

    historial.push(asistencia);
    localStorage.setItem(`historial_${gradoActual}_${mesActual}`, JSON.stringify(historial));
    alert(`Asistencia de ${mesActual} Guardada Exitosamente`);
}

function nuevaAsistencia() {
    const alumnos = baseAlumnos[gradoActual] || [];
    alumnos.forEach((_, i) => {
        const select = document.getElementById(`estado-${i}`);
        if(select) select.value = "A";
    });
    alert("Lista reiniciada");
}

function eliminarHistorial() {
    if (confirm(`¿Eliminar todo el historial de ${gradoActual} del mes de ${mesActual}?`)) {
        localStorage.removeItem(`historial_${gradoActual}_${mesActual}`);
        historial = [];
        alert(`Historial de ${mesActual} eliminado`);
        generarListaAlumnos();
    }
}

// NUEVA FUNCIÓN: ELIMINAR EL MES COMPLETO DE LOS 5 GRADOS A LA VEZ
// ==============================================================
function eliminarMesCompleto() {
    actualizarMesActual();
    
    // Primer filtro de seguridad
    if (confirm(`⚠ ATENCIÓN: ¿Está completamente seguro de que desea eliminar TODO el historial de asistencia de los CINCO GRADOS correspondientes al mes de ${mesActual}?`)) {
        
        // Segundo filtro de seguridad (Doble confirmación)
        if (confirm(`🚨 ¡ESTA ACCIÓN NO SE PUEDE DESHACER!\nSe borrarán las asistencias de 1°, 2°, 3°, 4° y 5° de Secundaria del mes de ${mesActual}.\n\n¿Desea continuar de todos modos?`)) {
            
            // Recorrer los 5 grados y limpiar las llaves de memoria de ese mes específico
            listaGrados.forEach(grado => {
                localStorage.removeItem(`historial_${grado}_${mesActual}`);
            });
            
            alert(`🗑 Los registros de asistencia del mes de ${mesActual} han sido eliminados por completo de toda la institución.`);
        }
    }
}

function exportarVistaWeb() {
    if (historial.length === 0) {
        alert(`No hay datos guardados para mostrar en este mes (${mesActual}).`);
        return;
    }

    const alumnos = baseAlumnos[gradoActual] || [];
    let totalesPorFecha = {};
    historial.forEach(r => { totalesPorFecha[r.fecha] = { A: 0, T: 0, F: 0 }; });
    let granTotalA = 0, granTotalT = 0, granTotalF = 0;

    let tablaHTML = `
    <table border="1" style="border-collapse: collapse; width: 100%; font-family: Arial; font-size: 12px; text-align: center;">
        <thead>
            <tr style="background-color: #007BFF; color: white; font-weight: bold; height: 30px;">
                <th style="width: 40px;">N°</th>
                <th style="text-align: left; padding-left: 10px; width: 280px;">ALUMNO</th>
    `;

    historial.forEach(r => { tablaHTML += `<th style="width: 50px;">${r.fecha}</th>`; });

    tablaHTML += `
                <th style="background-color: #28a745; color: white; width: 50px;">TOT Asis</th>
                <th style="background-color: #ff9800; color: white; width: 50px;">TOT Tard</th>
                <th style="background-color: #dc3545; color: white; width: 50px;">TOT Falt</th>
            </tr>
        </thead>
        <tbody>
    `;

    alumnos.forEach((alumno, i) => {
        let contadorAlumnoA = 0, contadorAlumnoT = 0, contadorAlumnoF = 0;
        tablaHTML += `<tr style="height: 24px;">`;
        tablaHTML += `<td>${i + 1}</td>`;
        tablaHTML += `<td style="text-align: left; padding-left: 10px; font-weight: bold;">${alumno}</td>`;

        historial.forEach(r => {
            let estado = r.datos[alumno] || "-";
            let colorCelda = "";
            if (estado === "A") { colorCelda = "background-color: #90EE90; font-weight: bold;"; contadorAlumnoA++; totalesPorFecha[r.fecha].A++; }
            else if (estado === "T") { colorCelda = "background-color: #FFD966; font-weight: bold;"; contadorAlumnoT++; totalesPorFecha[r.fecha].T++; }
            else if (estado === "F") { colorCelda = "background-color: #FF7B7B; font-weight: bold;"; contadorAlumnoF++; totalesPorFecha[r.fecha].F++; }
            tablaHTML += `<td style="${colorCelda}">${estado}</td>`;
        });

        granTotalA += contadorAlumnoA; granTotalT += contadorAlumnoT; granTotalF += contadorAlumnoF;
        tablaHTML += `<td style="font-weight: bold; background-color: #e2f0d9;">${contadorAlumnoA}</td>`;
        tablaHTML += `<td style="font-weight: bold; background-color: #fff2cc;">${contadorAlumnoT}</td>`;
        tablaHTML += `<td style="font-weight: bold; background-color: #fce4d6;">${contadorAlumnoF}</td></tr>`;
    });

    tablaHTML += `<tr style="height: 24px; font-weight: bold; background-color: #d9e1f2;"><td colspan="2" style="text-align: right; padding-right: 10px;">TOTAL ASISTENCIAS (✅)</td>`;
    historial.forEach(r => { tablaHTML += `<td>${totalesPorFecha[r.fecha].A}</td>`; });
    tablaHTML += `<td colspan="3" style="background-color: #b4c6e7;">${granTotalA} Total</td></tr>`;

    tablaHTML += `<tr style="height: 24px; font-weight: bold; background-color: #fff2cc;"><td colspan="2" style="text-align: right; padding-right: 10px;">TOTAL TARDANZAS (⏰)</td>`;
    historial.forEach(r => { tablaHTML += `<td>${totalesPorFecha[r.fecha].T}</td>`; });
    tablaHTML += `<td colspan="3" style="background-color: #ffe699;">${granTotalT} Total</td></tr>`;

    tablaHTML += `<tr style="height: 24px; font-weight: bold; background-color: #fce4d6;"><td colspan="2" style="text-align: right; padding-right: 10px;">TOTAL FALTAS (❌)</td>`;
    historial.forEach(r => { tablaHTML += `<td>${totalesPorFecha[r.fecha].F}</td>`; });
    tablaHTML += `<td colspan="3" style="background-color: #f8cbad;">${granTotalF} Total</td></tr></tbody></table>`;

    const ventanaReporte = window.open("", "_blank");
    ventanaReporte.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <title>Reporte de Asistencia - ${gradoActual}</title>
            <style>body { font-family: Arial, sans-serif; padding: 20px; color: #333; } .header-reporte { margin-bottom: 20px; line-height: 1.6; } .btn-imprimir { background: #007BFF; color: white; padding: 10px 20px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 20px; } @media print { .btn-imprimir { display: none; } }</style>
        </head>
        <body>
            <button class="btn-imprimir" onclick="window.print()">🖨️ Imprimir / Guardar en PDF</button>
            <div class="header-reporte"><strong>COLEGIO:</strong> ${infoGeneral.colegio}<br><strong>GRADO:</strong> ${gradoActual}<br><strong>AÑO:</strong> ${infoGeneral.anio}<br><strong>MES:</strong> ${mesActual}</div>
            ${tablaHTML}
        </body>
        </html>
    `);
    ventanaReporte.document.close();
}

function abrirConsolidadoWeb() {
    actualizarMesActual();
    let datosConsolidados = [];
    
    listaGrados.forEach(grado => {
        let hG = JSON.parse(localStorage.getItem(`historial_${grado}_${mesActual}`)) || [];
        let totalA = 0, totalT = 0, totalF = 0;
        
        hG.forEach(registro => {
            Object.values(registro.datos).forEach(estado => {
                if (estado === "A") totalA++;
                if (estado === "T") totalT++;
                if (estado === "F") totalF++;
            });
        });
        
        datosConsolidados.push({ grado, A: totalA, T: totalT, F: totalF });
    });

    let totalGlobal = datosConsolidados.reduce((sum, g) => sum + g.A + g.T + g.F, 0);
    if(totalGlobal === 0) {
        alert(`Aún no existen asistencias guardadas en ningún grado para el mes de ${mesActual}.`);
        return;
    }

    const dataJSON = JSON.stringify(datosConsolidados);

    const ventanaConsolidado = window.open("", "_blank");
    ventanaConsolidado.document.write(`
        <!DOCTYPE html>
        <html lang="es">
        <head>
            <meta charset="UTF-8">
            <title>Consolidado Institucional - ${mesActual}</title>
            <script src="https://cdn.jsdelivr.net/npm/chart.js"><\/script>
            <style>
                body { font-family: Arial, sans-serif; padding: 25px; background: #f8f9fa; color: #333; }
                .header-c { background: #1e3c72; color: white; padding: 20px; border-radius: 8px; margin-bottom: 25px; }
                .header-c h2 { margin: 0 0 10px 0; }
                table { width: 100%; border-collapse: collapse; margin-bottom: 30px; background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
                th, td { border: 1px solid #dee2e6; padding: 12px; text-align: center; font-size: 14px; }
                th { background-color: #2a5298; color: white; font-weight: bold; }
                .grados-col { text-align: left; font-weight: bold; background: #f1f3f5; }
                .totales-f { font-weight: bold; background: #e9ecef; }
                .contenedor-grafico { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 800px; margin: 0 auto 30px auto; }
                .btn-print { background: #28a745; color: white; padding: 12px 25px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; display: block; margin-bottom: 20px; }
                @media print { .btn-print { display: none; } }
            </style>
        </head>
        <body>
            <button class="btn-print" onclick="window.print()">🖨️ Imprimir Consolidado / PDF</button>

            <div class="header-c">
                <h2>📊 CONSOLIDADO GENERAL DE ASISTENCIA</h2>
                <strong>INSTITUCIÓN:</strong> ${infoGeneral.colegio} | <strong>AÑO:</strong> ${infoGeneral.anio} | <strong>MES EVALUADO:</strong> ${mesActual}
            </div>

            <table>
                <thead>
                    <tr>
                        <th>GRADO Y SECCIÓN</th>
                        <th style="background-color: #28a745;">TOTAL ASISTENCIAS (✅)</th>
                        <th style="background-color: #ff9800;">TOTAL TARDANZAS (⏰)</th>
                        <th style="background-color: #dc3545;">TOTAL FALTAS (❌)</th>
                    </tr>
                </thead>
                <tbody id="tabla-c-body"></tbody>
            </table>

            <div class="contenedor-grafico">
                <h3 style="text-align:center; margin-top:0; color:#1e3c72;">Comparativa de Asistencia - Mes: ${mesActual}</h3>
                <canvas id="graficoConsolidado"></canvas>
            </div>

            <script>
                const datos = ${dataJSON};
                const tbody = document.getElementById("tabla-c-body");
                let sumA = 0, sumT = 0, sumF = 0;
                
                datos.forEach(g => {
                    sumA += g.A; sumT += g.T; sumF += g.F;
                    tbody.innerHTML += \`
                        <tr>
                            <td class="grados-col">\${g.grado}</td>
                            <td style="font-weight:bold; color:#218838;">\${g.A}</td>
                            <td style="font-weight:bold; color:#d39e00;">\${g.T}</td>
                            <td style="font-weight:bold; color:#c82333;">\${g.F}</td>
                        </tr>
                    \`;
                });
                
                tbody.innerHTML += \`
                    <tr class="totales-f">
                        <td>TOTAL GENERAL (I.E.P.)</td>
                        <td>\${sumA}</td>
                        <td>\${sumT}</td>
                        <td>\${sumF}</td>
                    </tr>
                \`;

                const ctx = document.getElementById('graficoConsolidado').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: datos.map(g => g.grado),
                        datasets: [
                            { label: 'Asistencias (✅)', data: datos.map(g => g.A), backgroundColor: '#4caf50', borderColor: '#388e3c', borderWidth: 1 },
                            { label: 'Tardanzas (⏰)', data: datos.map(g => g.T), backgroundColor: '#ff9800', borderColor: '#f57c00', borderWidth: 1 },
                            { label: 'Faltas (❌)', data: datos.map(g => g.F), backgroundColor: '#f44336', borderColor: '#d32f2f', borderWidth: 1 }
                        ]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true, title: { display: true, text: 'Cantidad de Registros', font: { weight: 'bold' } } },
                            x: { title: { display: true, text: 'Grados Evaluados', font: { weight: 'bold' } } }
                        },
                        plugins: { legend: { position: 'top' } }
                    }
                });
            <\/script>
        </body>
        </html>
    `);
    ventanaConsolidado.document.close();
}
</script>

</body>
</html>
